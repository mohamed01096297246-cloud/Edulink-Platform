# Runs on every push: the backend's tests (against a throwaway in-memory
# database, never the real one) and a production build of the web panel.
# A red run here means something broke — see the run's log on GitHub.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Cache the test database engine
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-7.0.24-ubuntu2204
      - run: npm test

  web-panel:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # CRA treats lint warnings as errors when CI=true; the build itself is
      # what we want to prove here.
      - run: npm run build
        env:
          CI: "false"
